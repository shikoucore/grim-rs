<svg width="100%" viewBox="0 0 680 250" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title id="title">Image Processing Pipeline</title>
  <desc id="desc">Последовательность обработки кадра: захват → буфер → трансформация → инверсия Y → масштабирование → конвертация формата → сохранение</desc>
  
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .box-orange { fill: #ffedd5; stroke: #334155; stroke-width: 2; }
      .box-gray { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
      .box-purple { fill: #ede9fe; stroke: #334155; stroke-width: 2; }
      .box-green { fill: #dcfce7; stroke: #334155; stroke-width: 2; }
      .txt { fill: #0f172a; font: 14px "Fira Sans", "Segoe UI", sans-serif; font-weight: 500; }
      .sub { fill: #334155; font: 12px "Fira Sans", "Segoe UI", sans-serif; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Row 1: Capture → Buffer → Transform → Y-invert -->
  <rect class="box box-orange" x="20" y="30" width="140" height="56"/>
  <text class="txt" x="90" y="52" text-anchor="middle">Capture frame</text>
  <text class="sub" x="90" y="72" text-anchor="middle">Wayland / DXGI</text>

  <rect class="box box-gray" x="200" y="30" width="80" height="56"/>
  <text class="txt" x="240" y="60" text-anchor="middle">Buffer</text>

  <rect class="box box-purple" x="322" y="30" width="140" height="56"/>
  <text class="txt" x="392" y="52" text-anchor="middle">Output transform</text>
  <text class="sub" x="392" y="72" text-anchor="middle">rotation / flip</text>

  <rect class="box box-green" x="504" y="30" width="80" height="56"/>
  <text class="txt" x="544" y="52" text-anchor="middle">Y-invert</text>
  <text class="sub" x="544" y="72" text-anchor="middle">Wayland only</text>

  <!-- Row 2: Scaling → Format conversion → Save -->
  <rect class="box box-purple" x="20" y="170" width="140" height="56"/>
  <text class="txt" x="90" y="192" text-anchor="middle">Scaling</text>
  <text class="sub" x="90" y="212" text-anchor="middle">Nearest · Triangle</text>

  <rect class="box box-green" x="200" y="170" width="140" height="56"/>
  <text class="txt" x="270" y="192" text-anchor="middle">Format conversion</text>
  <text class="sub" x="270" y="212" text-anchor="middle">BGRA / ARGB → RGBA</text>

  <rect class="box box-orange" x="380" y="170" width="80" height="56"/>
  <text class="txt" x="420" y="198" text-anchor="middle">Save</text>

  <!-- Arrows row 1 -->
  <line class="arrow" x1="160" y1="58" x2="198" y2="58"/>
  <line class="arrow" x1="280" y1="58" x2="320" y2="58"/>
  <line class="arrow" x1="462" y1="58" x2="502" y2="58"/>

  <!-- Arrow from Y-invert to Scaling (curved) -->
  <path class="arrow" d="M544 86 L544 140 L90 140 L90 168"/>

  <!-- Arrows row 2 -->
  <line class="arrow" x1="160" y1="198" x2="198" y2="198"/>
  <line class="arrow" x1="340" y1="198" x2="378" y2="198"/>
</svg>
