name: PR Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-merge-commits:
    name: No merge commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge commits
        run: |
          MERGES=$(git log --oneline --merges "origin/${{ github.base_ref }}..HEAD" | wc -l)
          if [ "$MERGES" -gt 0 ]; then
            echo "::error::PR contains ${MERGES} merge commit(s). Rebase onto ${{ github.base_ref }} instead of merging."
            git log --oneline --merges "origin/${{ github.base_ref }}..HEAD"
            exit 1
          fi
          echo "No merge commits found"

  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          # Check each commit in the PR follows conventional commits format
          # Allowed: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
          BAD_COMMITS=$(git log --oneline "origin/${{ github.base_ref }}..HEAD" --format="%s" | grep -v '^Merge ' | sed 's/^ *//' | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+' || true)
          if [ -n "$BAD_COMMITS" ]; then
            echo "::error::The following commits do not follow conventional commits format:"
            echo "$BAD_COMMITS"
            echo ""
            echo "Expected format: type(scope): description"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "All commits follow conventional commits format"
